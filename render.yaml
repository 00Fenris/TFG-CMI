databases:
  # 1. Base de datos PostgreSQL gratuita
  - name: tfg-cmi-db
    databaseName: tfg_cmi
    user: tfguser
    plan: free
    region: frankfurt
    postgresMajorVersion: "15"

services:
  # 2. Backend (Node.js)
  - type: web
    name: tfg-cmi-backend
    env: node
    plan: free
    region: frankfurt
    buildCommand: "cd backend && npm install"
    startCommand: "cd backend && node src/seed.js && npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tfg-cmi-db
          property: connectionString
      - key: SEED_DB
        value: "true"
      - key: JWT_SECRET
        generateValue: true

  # 3. Frontend (React)
  - type: web
    name: tfg-cmi-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/build"
    envVars:
      - key: REACT_APP_API_URL
        value: https://tfg-cmi-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
